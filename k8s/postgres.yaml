apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: beauty }
            - { name: POSTGRES_PASSWORD, value: beauty }
            - { name: POSTGRES_DB, value: beauty }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          args: ["-c", "max_connections=200"]
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "beauty"] }
            periodSeconds: 3
          # Resource limits are changed by the experiments with `kubectl set resources`.
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
spec:
  type: NodePort
  selector: { app: postgres }
  ports:
    - { port: 5432, targetPort: 5432, nodePort: 30432 }
