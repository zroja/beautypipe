[project]
name = "beautypipe"
version = "0.1.0"
description = "Reference Kafka + Postgres pipeline for beauty product events, built to measure when the sink (not the stream) limits throughput."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
columnar = ["duckdb>=1.1", "pyarrow>=16"]
dev = ["pytest>=8", "matplotlib>=3.8", "duckdb>=1.1", "pyarrow>=16"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["beautypipe"]

[tool.setuptools.package-data]
beautypipe = ["data/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (DATABASE_URL)"]
